aid: vuoriclothing
name: Vuori
description: 'Vuori is a California-based performance athletic apparel and activewear
  brand founded in 2015 in Encinitas, offering men''s and women''s clothing built for
  training, running, yoga, and everyday wear. The direct-to-consumer business runs on
  a Shopify storefront at vuoriclothing.com plus a growing retail footprint, and is a
  portfolio company of Norwest Venture Partners (and later SoftBank Vision Fund). Vuori
  publishes no public developer API or developer portal; it exposes a consumer web/mobile
  storefront, a help center, and a brand blog. This API Evangelist profile captures the
  company''s real public web surface — its security.txt vulnerability-disclosure contact,
  domain-security posture, and customer-facing pages — rather than a developer program,
  which does not exist.'
